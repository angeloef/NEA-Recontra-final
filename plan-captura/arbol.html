<script id="DATA" type="application/json">[{"file": "00-INDICE.md", "n": "00", "group": "Panorama", "title": "Plan de captura de datos del lead — índice", "body": "# Plan de captura de datos del lead — índice\n\nQué le pedimos a un cliente después del contacto positivo, en qué orden, por qué canal\ny con qué devolución a cambio. Un archivo por tramo, más tres transversales.\n\n| # | Archivo | Qué cubre |\n|---|---|---|\n| 01 | [Enganche](01-tramo-enganche.md) | Primeras 4 preguntas por WhatsApp, filtro temprano, agenda |\n| 02 | [Pre-charla](02-tramo-pre-charla.md) | Micro-formulario de 5 campos y el trabajo previo que habilita |\n| 03 | [Descubrimiento](03-tramo-descubrimiento.md) | Guion completo de la videollamada de 45–60 min |\n| 04 | [Accesos y materiales](04-tramo-accesos.md) | Checklist de dominio, marca, contenido y datos técnicos |\n| 05 | [Validación y cierre](05-tramo-validacion.md) | Reunión de mockup, alcance final, presupuesto firmado |\n| 06 | [Ficha de datos](06-ficha-de-datos.md) | Los 10 bloques de información, campo por campo |\n| 07 | [Reglas de interacción](07-reglas-ux.md) | Los principios de UX que gobiernan todos los tramos |\n| 08 | [Plantillas de mensajes](08-plantillas-mensajes.md) | Textos listos para copiar, incluidos los de descarte |\n\n## El recorrido en una línea\n\nContacto positivo → 4 preguntas (15% de la ficha) → micro-form (35%) → charla de 45 min (70%)\n→ **diagnóstico escrito en menos de 24 h** → checklist de accesos (90%) → **mockup navegable**\n→ reunión de validación → presupuesto firmado (100%).\n\n## Las tres reglas que no se rompen\n\n1. **Cada pedido de datos paga con una devolución.** Nunca se pide \"para evaluar\".\n2. **Una sola ficha viva por cliente.** Preguntar dos veces lo mismo es la señal más rápida\n   de que no lo estamos escuchando.\n3. **Un solo recordatorio.** A las 48 h. Después, seguimiento a 90 días. No se persigue a nadie.\n\n## Salidas laterales\n\nNo son fracasos: son leads que se van a un lugar donde cuestan menos, en vez de comerse\ncuatro reuniones. Están documentadas en cada tramo y sus textos en el archivo 08.\n\n- **No encaja** (precio, plazo, rubro, decisión repartida) → se dice en la primera respuesta.\n- **No completa el formulario** → un recordatorio, después seguimiento.\n- **Frena después del diagnóstico** → se queda con el documento, seguimiento a 90 días.\n\n## Visual\n\nEl mapa gráfico de todo esto está en [PLAN-CAPTURA-LEAD.html](../PLAN-CAPTURA-LEAD.html).\nContexto de negocio en [CONTEXTO-NEGOCIO.md](../CONTEXTO-NEGOCIO.md).\n"}, {"file": "01-tramo-enganche.md", "n": "01", "group": "Tramos", "title": "Tramo 1 — Enganche", "body": "# Tramo 1 — Enganche\n\n**Canal:** WhatsApp · **Duración:** 2 minutos de su tiempo · **Ficha al cerrar:** 15%\n**Devolución que ofrecemos:** que miremos su caso y a sus competidores antes de hablar.\n\n## Objetivo\n\nNo es calificar el lead a fondo. Es **conseguir la charla y evitar la reunión que iba a terminar mal**.\nSe piden cuatro datos y ninguno requiere que la persona busque nada ni abra la computadora.\n\nTodo esto pasa dentro de la conversación de WhatsApp que ya está abierta. No se manda un link\ntodavía: mandar un formulario como primera respuesta a alguien que acaba de mostrar interés\nes la forma más rápida de enfriarlo.\n\n## Las cuatro preguntas\n\n| # | Pregunta | Qué dato deja | Para qué sirve |\n|---|---|---|---|\n| 1 | ¿Qué rubro y en qué ciudad estás? | Rubro, zona | Define competencia local y si el SEO local aplica |\n| 2 | ¿Qué es lo que hoy te está frenando? | El problema **en sus palabras** | Es la frase con la que abre el diagnóstico |\n| 3 | ¿Ya tenés web o sistema andando? | Situación de partida | Distingue proyecto nuevo de rediseño o migración |\n| 4 | ¿Te queda cómodo un rato de 45 min esta semana? | Disponibilidad real | Primer indicio de cuánto se va a involucrar |\n\nLa pregunta 2 se transcribe **literal** a la ficha. No se resume ni se traduce a vocabulario\ntécnico. \"La gente me pregunta el precio por Instagram y después desaparece\" vale mucho más\nque \"necesita mejorar la conversión\".\n\n## Qué mirar en la respuesta\n\n**Buenas señales**\n\n- Contesta las cuatro cosas sin que haya que repreguntar.\n- El problema está descrito en términos de negocio, no de tecnología.\n- Propone él un horario o dice cuándo puede.\n- Menciona que lo recomendó alguien: el referido cierra mucho más rápido.\n\n**Señales de alerta**\n\n- \"¿Cuánto sale una página web?\" y nada más. Responder con el link a precios, no con un número suelto.\n- \"Lo necesito para el lunes\". Ver salida lateral.\n- \"Tengo que consultarlo con los socios\" repetido varias veces: hay que encontrar al aprobador antes de invertir horas.\n- Contesta con monosílabos a las tres preguntas: probablemente no complete el formulario tampoco.\n\n## Filtro temprano: cuándo decir que no acá mismo\n\nSe dice en la primera respuesta, sin reunión de por medio, cuando aparece cualquiera de estos:\n\n- Busca **lo más barato del mercado** y lo dice explícito.\n- La fecha es **la semana que viene, sí o sí**, y el alcance no entra.\n- Su cliente final **elige sólo por precio más bajo**, sin marca en juego.\n- Quiere **garantía de primer puesto en Google con fecha**.\n- **Nadie puede aprobar** un diseño sin pasar por cinco personas.\n\nDecirlo temprano no pierde nada: el que igual quiere trabajar con nosotros vuelve, y el que\nno encajaba se ahorra (y nos ahorra) tres reuniones. El texto está en el archivo 08.\n\n## Salidas laterales\n\n| Situación | Qué se hace |\n|---|---|\n| No encaja | Se dice ahora, con recomendación concreta de alternativa si la hay |\n| Pregunta sólo el precio | Se manda el link de precios y el estimador, y se invita a la charla igual |\n| No contesta después del interés inicial | Un recordatorio a las 48 h, después seguimiento a 90 días |\n| Encaja pero no tiene tiempo ahora | Se acuerda una fecha concreta de recontacto y se anota |\n\n## Errores a evitar\n\n- Mandar el formulario antes de que haya una charla agendada.\n- Tirar un precio de memoria por WhatsApp sin haber entendido el alcance.\n- Hacer más de cuatro preguntas en el primer mensaje.\n- Contestar con un audio largo cuando la persona escribió tres líneas.\n\n## Qué queda registrado en la ficha\n\n`nombre` · `empresa` · `rubro` · `ciudad` · `problema (textual)` · `tiene web / sistema`\n· `canal de origen` · `fecha y hora de la charla` · `teléfono`\n"}, {"file": "02-tramo-pre-charla.md", "n": "02", "group": "Tramos", "title": "Tramo 2 — Pre-charla", "body": "# Tramo 2 — Pre-charla\n\n**Canal:** formulario web (link por WhatsApp) · **Duración:** 90 segundos · **Ficha al cerrar:** 35%\n**Devolución que ofrecemos:** llegar a la reunión con el análisis de sus competidores ya hecho.\n\n## Objetivo\n\nConseguir los cinco datos que **no se pueden dictar de memoria en una charla** (links, nombres,\nrangos) y que, si se piden en vivo, queman diez minutos de reunión buscando en el celular.\n\nEl formulario se manda **después** de agendar la charla, nunca antes, y va con una frase que\nexplica qué gana la persona por completarlo.\n\n## Los cinco campos\n\n| Campo | Tipo | Obligatorio | Por qué está |\n|---|---|---|---|\n| Sitio web y redes actuales | links | No | Auditamos lo que ya existe antes de hablar |\n| Tres competidores | texto libre | **Sí** | Es la mitad del diagnóstico y sólo él los conoce |\n| Rango de presupuesto | opciones cerradas | **Sí** | Evita la reunión que terminaba mal |\n| ¿Hay una fecha atada a algo? | texto corto | No | Temporada, apertura, feria, campaña |\n| ¿Quién decide y quién aprueba el diseño? | texto corto | **Sí** | El proyecto sin aprobador se estira el doble |\n\n### Rango de presupuesto: opciones cerradas\n\nSe ofrece como rangos, nunca como campo abierto. Un campo abierto hace que la persona tenga\nmiedo de decir de más o de menos, y muchos lo dejan vacío.\n\n- Hasta $250.000\n- $250.000 a $450.000\n- $450.000 a $800.000\n- Más de $800.000\n- Todavía no sé, quiero que me orienten\n\nLa última opción es importante: es honesta, y quien la elige suele estar bien igual. Lo que no\nqueremos es que abandone el formulario justo en ese campo.\n\n## Reglas de diseño del formulario\n\n- **Cinco campos y se termina.** Si aparece la tentación de sumar un sexto, va al tramo 3 o al 4.\n- Sin registro, sin login, sin \"creá una cuenta\".\n- Mobile primero: la mayoría lo abre desde WhatsApp, en el teléfono.\n- Cada campo con un ejemplo debajo, en gris, de lo que esperamos.\n- Confirmación al enviar que repite la fecha de la charla, para que no se olvide.\n- El envío **crea o actualiza la ficha**, no llega como un mail suelto.\n\n## El trabajo previo que habilita (lo que prometimos a cambio)\n\nNo es opcional. Es la contraprestación del formulario:\n\n1. **Auditar su sitio actual**, si tiene: velocidad en datos móviles, qué se ve en la primera\n   pantalla, si el contacto está a mano, si Google lo tiene indexado.\n2. **Mirar los tres competidores**: qué muestran primero, si publican precios, cómo captan el\n   contacto, qué tan rápido cargan.\n3. **Buscar el rubro en Google** como lo buscaría su cliente, desde su ciudad, y anotar quién\n   aparece arriba y por qué.\n4. **Revisar su Google Business** y sus redes: si existe, si está completo, cuántas reseñas.\n5. Anotar **tres hipótesis** de qué lo está frenando, para contrastarlas en la charla.\n\nSe llega a la videollamada con eso en pantalla. Es la diferencia entre una reunión de ventas y\nuna reunión donde el cliente aprende algo de su propio negocio.\n\n## Salidas laterales\n\n| Situación | Qué se hace |\n|---|---|\n| No completa el formulario en 48 h | **Un** recordatorio con el link. Nada más |\n| No completa y llega la fecha de la charla | Se hace igual, se pregunta en vivo, se pierden 10 min |\n| El rango no da para el alcance | Se avisa antes de la charla y se ofrece el alcance que sí entra |\n| Manda competidores que no son competidores | Señal de que no tiene claro con quién compite: material para el diagnóstico |\n\n## Errores a evitar\n\n- Pedir el presupuesto como campo abierto.\n- Hacer obligatorios los cinco campos.\n- Mandar el link sin explicar qué recibe a cambio.\n- Llegar a la charla con el formulario sin leer: destruye toda la credibilidad que el tramo construyó.\n\n## Qué queda registrado en la ficha\n\n`sitio actual` · `redes` · `competidor 1/2/3` · `rango de presupuesto` · `fecha atada`\n· `decisor` · `aprobador de diseño` · `notas de auditoría previa` · `3 hipótesis`\n"}, {"file": "03-tramo-descubrimiento.md", "n": "03", "group": "Tramos", "title": "Tramo 3 — Descubrimiento", "body": "# Tramo 3 — Descubrimiento\n\n**Canal:** videollamada · **Duración:** 45 a 60 minutos · **Ficha al cerrar:** 70%\n**Devolución que ofrecemos:** el diagnóstico escrito, con precios adentro, en menos de 24 horas.\n\n## Objetivo\n\nEntender **cómo entra hoy un cliente al negocio, dónde se cae y qué le preguntan siempre**.\nTodo lo demás (tecnología, diseño, alcance) se deduce de eso. Es la única reunión larga de\ntodo el recorrido, así que se aprovecha entera.\n\nSe pide permiso para grabar. Tomar notas a mano en una charla de una hora garantiza perder la\nmitad, y las frases textuales del cliente son materia prima de los textos del sitio.\n\n## Estructura: seis bloques\n\n### Bloque 0 · Devolución primero (5 min)\n\nSe abre mostrando el trabajo previo: qué encontramos en su sitio, qué hacen sus competidores,\nquién aparece primero en Google. **Antes de preguntar nada.** Esto cambia el tono de la reunión:\ndeja de ser un interrogatorio de ventas y pasa a ser una consulta.\n\n### Bloque 1 · El recorrido del cliente (12 min)\n\nLa pregunta madre. Se reconstruye paso a paso, sin dejar que se salte etapas:\n\n- ¿Por dónde te descubre alguien que no te conoce?\n- ¿Qué hace después? ¿Te escribe, te llama, va al local?\n- ¿Quién le contesta y en cuánto tiempo?\n- ¿Qué pasa entre esa primera respuesta y la venta?\n- **¿En qué punto se te cae la gente?**\n- ¿Cuántas consultas te entran por mes, más o menos? ¿Cuántas cierran?\n\nSi el cliente no sabe los números, se anota que no los sabe: eso también es un hallazgo, y es\nparte de lo que hay que instrumentar.\n\n### Bloque 2 · Su cliente final (10 min)\n\n- ¿Quién te compra? Contame el último que te compró.\n- **¿Qué te preguntan siempre antes de decidir?** (las preguntas repetidas son las secciones del sitio)\n- ¿Qué es lo que más los frena o los hace dudar?\n- ¿Qué les termina de convencer?\n- ¿Te llegan más del celular o de la computadora?\n- ¿Qué tan lejos vendés? ¿Zona, provincia, país?\n\n### Bloque 3 · La oferta y los números (8 min)\n\n- ¿Qué vendés exactamente? ¿Cuál es el servicio o producto estrella?\n- ¿Cuál te deja más margen, y cuál te gustaría vender más?\n- Ticket promedio, aunque sea grueso.\n- ¿Hay temporada alta y baja?\n- ¿Qué precio manejás frente a los competidores: más caro, igual, más barato? ¿Por qué?\n\n### Bloque 4 · Competencia y diferencia (7 min)\n\n- De los tres que pusiste en el formulario, ¿cuál te preocupa más y por qué?\n- ¿Por qué te elegiría a vos alguien que también los está mirando a ellos?\n- ¿Qué hacés vos que ellos no hagan? (si no hay respuesta clara, es trabajo de posicionamiento,\n  no de diseño, y hay que decirlo)\n\n### Bloque 5 · Éxito, restricciones y decisión (8 min)\n\n- Dentro de seis meses, ¿qué número tiene que haberse movido para que esto haya valido la pena?\n- ¿Cuál es ese número **hoy**? (línea base; sin esto no hay forma de demostrar el resultado)\n- ¿Hay una fecha atada a algo real?\n- ¿Quién aprueba el diseño y en cuánto tiempo suele responder?\n- ¿Cómo preferís que avancemos: WhatsApp, mail, llamadas?\n\n### Cierre (5 min)\n\nSe resume lo entendido **en voz alta y con sus palabras**, se confirma que sea correcto y se\nanuncia el diagnóstico: qué va a incluir y cuándo llega. Se termina antes de tiempo si se puede.\n\n## Si el proyecto es un sistema a medida\n\nSe agrega un bloque, o se agenda una segunda instancia, idealmente con visita o pantalla compartida:\n\n- ¿Cómo funciona hoy el proceso, paso a paso, desde que entra un pedido hasta que se cobra?\n- ¿Qué se anota, dónde y quién lo anota? (planillas, cuadernos, WhatsApp, sistema viejo)\n- ¿Cuál es la excepción que rompe siempre el proceso?\n- ¿Cuántas operaciones por día en el pico?\n- ¿Con qué se tiene que hablar: AFIP, Mercado Pago, un ERP, la tienda, el banco?\n- ¿Quién lo va a usar y qué tan cómodo está con la tecnología?\n\nDetalle completo en [06-ficha-de-datos.md](06-ficha-de-datos.md), bloque I.\n\n## Reglas de la charla\n\n- **Preguntas de negocio, no de tecnología.** Nadie tiene que saber qué es un CMS para contestarnos bien.\n- **Silencio después de preguntar.** La segunda mitad de la respuesta es la buena.\n- No se propone solución durante la charla. La solución va en el diagnóstico, escrita y pensada.\n- No se promete plazo ni precio exacto en vivo: se dice el rango y que el número va por escrito.\n- Si aparece un tema que no manejamos, se dice en el momento.\n\n## Salidas laterales\n\n| Situación | Qué se hace |\n|---|---|\n| Aparece un decisor oculto | Se pide sumarlo antes del mockup, no después |\n| El presupuesto real no da | Se ofrece el alcance que sí entra, o se sugiere empezar por una etapa |\n| No hay diferencia competitiva clara | Se dice, y el primer trabajo pasa a ser de posicionamiento |\n| Se cae la reunión | Se reagenda una vez. A la segunda caída, seguimiento a 90 días |\n\n## Qué queda registrado en la ficha\n\n`recorrido del cliente` · `punto de caída` · `consultas/mes` · `tasa de cierre` · `preguntas\nfrecuentes textuales` · `objeciones` · `ticket` · `margen` · `estacionalidad` · `zona`\n· `diferencial` · `métrica de éxito` · `línea base` · `restricciones` · `grabación y resumen`\n"}, {"file": "04-tramo-accesos.md", "n": "04", "group": "Tramos", "title": "Tramo 4 — Accesos y materiales", "body": "# Tramo 4 — Accesos y materiales\n\n**Canal:** checklist asincrónico (WhatsApp o mail) · **Duración:** días, no minutos · **Ficha al cerrar:** 90%\n**Devolución que ofrecemos:** el mockup navegable con su contenido real, no con texto de relleno.\n\n## Objetivo\n\nJuntar lo que hace falta para que el diseño se arme con **su marca, sus fotos y sus textos**.\nEs el tramo donde más proyectos se frenan, y casi siempre por lo mismo: fotos que no existen\ny accesos que nadie sabe dónde están.\n\nSe manda después de que el diagnóstico fue leído y hubo un sí conceptual. Nunca antes: pedir\naccesos a alguien que todavía no decidió se lee como invasivo.\n\n## Cómo se pide\n\nComo **lista tildable, con un ejemplo de dónde encontrar cada cosa**. Nada de \"mandame los\naccesos\", que garantiza tres días de ida y vuelta. Lo que no aparezca lo resolvemos nosotros,\ny eso se dice explícito para que nadie se trabe por vergüenza.\n\n## Checklist\n\n### Dominio y hosting\n\n- [ ] **Dominio**: cuál es y **a nombre de quién está**. Si no sabe: se verifica en NIC.ar o con un whois.\n- [ ] Usuario y clave del panel donde se administra (NIC.ar, GoDaddy, Donweb, el que sea)\n- [ ] Hosting actual, si tiene, y sus accesos\n- [ ] Correos corporativos: cuántos, en qué servicio, quién los administra\n- [ ] Si el dominio está a nombre del proveedor anterior: **esto se resuelve primero**, antes de diseñar nada\n\n### Analítica y presencia\n\n- [ ] Google Analytics y Search Console (invitación a nuestra cuenta, no la clave)\n- [ ] Ficha de Google Business: acceso o transferencia de propiedad\n- [ ] Redes sociales activas y quién las maneja\n- [ ] Píxel de Meta o etiquetas de Ads existentes\n- [ ] Cuenta de Google Ads previa, si hubo campañas\n\n### Marca\n\n- [ ] Logo en vector (.ai, .svg, .eps) o el archivo de mayor calidad que tenga\n- [ ] Manual de marca, o al menos colores y tipografías si existen\n- [ ] Versiones del logo: fondo claro, fondo oscuro, isotipo suelto\n\n### Contenido\n\n- [ ] Fotos propias: cuántas, de qué, y en qué calidad\n- [ ] Video, si hay material filmado\n- [ ] Catálogo, lista de precios o menú actualizado\n- [ ] Textos existentes: folletos, presentaciones, la web vieja\n- [ ] Certificaciones, premios, clientes que se puedan nombrar\n- [ ] Equipo: fotos y cargos, si el sitio los va a mostrar\n\n### Operación (sólo tienda o sistema)\n\n- [ ] Planilla de productos con variantes y stock\n- [ ] Cuenta de Mercado Pago o pasarela elegida\n- [ ] Datos de facturación electrónica y certificado AFIP, si va facturación\n- [ ] Transportes con los que trabaja y costos de envío\n- [ ] Accesos al sistema actual, si hay que integrar\n\n### Administrativo\n\n- [ ] Razón social, CUIT y datos de facturación\n- [ ] Responsable de pagos y forma de pago acordada\n\n## Reglas de manejo de accesos\n\n- **Se pide acceso, no la contraseña**, siempre que la plataforma lo permita (Analytics, Business,\n  Ads, Mercado Pago: todos permiten invitar a un usuario).\n- Cuando sí hace falta la clave, se recibe por un canal distinto al que se usó para el usuario,\n  y se cambia al terminar el proyecto.\n- Nada de claves en el chat general del proyecto ni en un documento compartido con el equipo entero.\n- Al cierre del proyecto, **todo queda a nombre del cliente** y nuestros usuarios se retiran si lo pide.\n\n## Diagnóstico de fotos: la demora número uno\n\nSe resuelve en este tramo, no cuando el diseño ya está armado. Tres escenarios:\n\n| Escenario | Salida |\n|---|---|\n| Tiene fotos propias buenas | Se usan, con retoque de luz y color si hace falta (+$30.000) |\n| Tiene fotos, pero desparejas o de celular | Retoque, o selección de las que se salvan y banco para el resto |\n| No tiene fotos | Se define ahora: sesión propia, banco de imágenes o dirección visual que no dependa de foto |\n\nLa misma lógica aplica a los textos: si no hay nada escrito, se agenda la charla de redacción,\nque **está incluida en el precio del sitio**.\n\n## Seguimiento\n\n- Se manda el checklist una vez, completo.\n- Recordatorio a las 48 h **sólo de lo que falta**, no de la lista entera.\n- Si a la semana falta algo bloqueante, se avisa qué se está frenando y qué fecha se corre.\n- Lo no bloqueante no detiene el mockup: se arma con lo que hay y se marca como pendiente.\n\n## Salidas laterales\n\n| Situación | Qué se hace |\n|---|---|\n| El dominio está a nombre del proveedor anterior | Se para y se gestiona la transferencia primero |\n| No consigue el logo en vector | Se revectoriza (extra de identidad) o se rediseña |\n| Nunca manda nada en dos semanas | Se pausa el proyecto formalmente, con fecha de retomada |\n\n## Qué queda registrado en la ficha\n\n`dominio y titular` · `accesos otorgados` · `analytics/GSC` · `Google Business` · `logo (formato)`\n· `estado de fotos` · `catálogo` · `medios de pago` · `datos de facturación` · `pendientes`\n"}, {"file": "05-tramo-validacion.md", "n": "05", "group": "Tramos", "title": "Tramo 5 — Validación y cierre", "body": "# Tramo 5 — Validación y cierre\n\n**Canal:** reunión sobre el mockup (video o presencial) · **Duración:** 30 a 45 min · **Ficha al cerrar:** 100%\n**Devolución que ofrecemos:** el sitio ya se ve y se toca antes de que exista un contrato.\n\n## Objetivo\n\nQue el cliente **abra el diseño en su celular** y decida sobre algo real, no sobre una\ndescripción. Este es el momento donde cambiar cosas cuesta una tarde; después de programado,\ncuesta plata. Toda la energía del tramo va a que las correcciones salgan ahora.\n\n## Antes de la reunión\n\n- El link del mockup se manda **24 horas antes**, para que lo mire solo y sin nosotros mirándolo mirar.\n- Se manda con una instrucción corta: \"abrilo en el celular, tocá todo, anotá lo que te chirríe\".\n- Se avisa qué está y qué no: qué páginas hay, qué es contenido real y qué es provisorio.\n\n## Durante la reunión\n\n### 1. Se escucha primero (10 min)\n\nQué le gustó, qué no, qué le falta. Sin defender el diseño. Las primeras reacciones espontáneas\nvalen más que cualquier lista de features.\n\n### 2. Se ordenan las correcciones en tres cajones (10 min)\n\n| Cajón | Qué es | Cuándo se hace |\n|---|---|---|\n| **Ahora** | Textos, fotos, orden de secciones, colores, jerarquía | Antes de programar. Sin costo |\n| **Después** | Funciones que se suman como extra con precio de lista | Se cotiza y se decide en esta misma reunión |\n| **No** | Pedidos que empeoran el resultado | Se explica por qué, con el argumento del cliente final |\n\nEl cajón \"No\" existe y se usa. Si un pedido baja la conversión o rompe la jerarquía, decirlo es\nparte del trabajo. Se dice una vez, con el motivo, y si el cliente insiste, se hace y se anota.\n\n### 3. Se cierra el alcance (10 min)\n\n- Qué producto base queda (landing, institucional, tienda, reservas)\n- Qué extras entran y cuáles quedan para una segunda etapa\n- Qué páginas exactamente\n- Qué queda afuera, dicho explícito\n\n### 4. Se acuerda cómo se trabaja (5 min)\n\n- Quién aprueba cada entrega y en cuánto tiempo responde\n- Canal y frecuencia de avance\n- Fecha de publicación estimada, atada a los pendientes de contenido\n- Qué pasa si el contenido se demora: la fecha se corre, y se dice ahora\n\n## Datos administrativos que se piden acá y no antes\n\nSe piden recién cuando ya hay un sí. Pedirlos antes se lee como que damos la venta por hecha.\n\n- Razón social y CUIT\n- Domicilio fiscal y condición frente al IVA\n- Responsable de pagos, con su contacto directo\n- Forma y momento de pago acordados\n- Mail donde va la factura\n\n## El presupuesto\n\nSe manda por escrito **dentro de las 24 horas** de la reunión, con:\n\n- Producto base y precio\n- Extras elegidos, uno por uno con su precio\n- Total, forma de pago y plazo estimado\n- Qué incluye siempre (diagnóstico, mockup, primer año de soporte, dominio y código a su nombre)\n- Qué queda explícitamente afuera\n- Qué se paga el año 2 en adelante\n\nNada de números que aparecen después. Si algo no estaba en el presupuesto, no se factura.\n\n## Salidas laterales\n\n| Situación | Qué se hace |\n|---|---|\n| El mockup no convence | Se pregunta qué específicamente, se corrige una vez. Si sigue sin cerrar, se cierra el proyecto bien |\n| Aparece un decisor nuevo acá | Se hace una segunda pasada corta con esa persona, sin rehacer todo |\n| Quiere todo pero no le da el presupuesto | Se parte en etapas: qué sale primero y qué queda para la segunda |\n| Frena por plata | Queda el diagnóstico y el mockup, y seguimiento a 90 días |\n\n## Después del sí\n\n1. Presupuesto firmado o aceptado por escrito, aunque sea por WhatsApp.\n2. Se agenda la fecha de arranque de desarrollo.\n3. Se cierra la ficha del lead y se abre el proyecto.\n4. Se anota la **línea base** de la métrica de éxito, con fecha. Ese número es lo que después\n   convierte este trabajo en un caso publicable.\n\n## Qué queda registrado en la ficha\n\n`alcance final` · `extras aprobados` · `precio` · `forma de pago` · `datos fiscales`\n· `aprobador y tiempos` · `fecha estimada de publicación` · `pendientes de contenido`\n· `métrica de éxito con línea base y fecha`\n"}, {"file": "06-ficha-de-datos.md", "n": "06", "group": "Transversal", "title": "La ficha de datos — los 10 bloques", "body": "# La ficha de datos — los 10 bloques\n\nTodo lo que necesitamos saber de un cliente para hacer un trabajo excelente, agrupado por bloque,\ncon el tramo donde se pide. **Es un solo documento vivo por cliente**: cada tramo lo completa,\nnadie vuelve a preguntar lo que ya está adentro.\n\nLos bloques marcados como **críticos** son los que, si faltan, hacen que el trabajo salga\ngenérico o haya que rehacerlo.\n\n---\n\n## A · Decisión y contexto — crítico · tramos 1–2\n\n| Campo | Ejemplo | Por qué |\n|---|---|---|\n| Nombre y empresa | Marcos, Metalúrgica del Sur | Obvio, pero se escribe bien desde el principio |\n| Rubro y ciudad | Metalurgia, Oberá | Competencia local, SEO local |\n| Canal de origen | Referido de X, Google, Instagram | Dice cuánto confía de entrada |\n| Quién decide | El dueño / dos socios / un gerente | Un proyecto sin decisor claro se estira el doble |\n| Quién aprueba el diseño | Nombre y su tiempo de respuesta | Es distinto de quien firma el cheque |\n| Fecha atada a algo | Feria de octubre, apertura de local | Restricción real vs apuro genérico |\n| Canal preferido | WhatsApp, mail, llamadas | Se respeta el que ya usa |\n\n---\n\n## B · Cómo entra un cliente hoy — crítico · tramo 3\n\nLa pregunta madre. De acá sale la arquitectura del sitio, los textos y qué automatizar.\n\n- Recorrido completo: descubrimiento → contacto → respuesta → venta\n- **Punto de caída**: dónde se pierde la gente\n- Consultas por mes y por qué canal entran\n- Cuántas cierran (aunque sea a ojo)\n- Quién contesta y en cuánto tiempo\n- Qué pasa con los que no compran: ¿se les hace seguimiento?\n\nSi no sabe los números, eso también se anota: es parte de lo que hay que instrumentar.\n\n---\n\n## C · Cliente final — crítico · tramo 3\n\n- Perfil de quien compra, con un caso concreto reciente\n- **Qué preguntan siempre antes de decidir** → son, literalmente, las secciones del sitio\n- Qué los frena o los hace dudar → son las objeciones que la copy tiene que desarmar\n- Qué termina de convencerlos\n- Dispositivo predominante\n- Zona de cobertura\n\nSe guardan **frases textuales**, no resúmenes. Las palabras del cliente son la materia prima\nde los textos y de las búsquedas por las que hay que posicionar.\n\n---\n\n## D · Oferta y números — tramo 3\n\n- Qué vende, con el producto o servicio estrella\n- Cuál deja más margen y cuál querría vender más\n- Ticket promedio\n- Estacionalidad\n- Posición de precio frente a la competencia, y por qué\n\nDefine qué se pone adelante en el sitio y cuánto tiene sentido invertir en pauta.\n\n---\n\n## E · Métrica de éxito — crítico · tramo 3\n\n| Campo | Ejemplo |\n|---|---|\n| Qué número tiene que moverse | Consultas calificadas por mes |\n| Valor de hoy (línea base) | 12 |\n| Objetivo a 6 meses | 30 |\n| Cómo se va a medir | Formularios + clics a WhatsApp en Analytics |\n| Fecha en que se tomó la línea base | 19/08/2026 |\n\nSin línea base no hay forma de demostrar el resultado, ni de defender la renovación del soporte,\nni de publicar el caso. **Se toma antes de tocar nada.**\n\n---\n\n## F · Competencia — tramo 2\n\n- Tres competidores con sus links\n- Cuál le preocupa más y por qué cree que le gana\n- Qué hace él que los otros no hagan (su diferencial, en sus palabras)\n- Qué encontramos nosotros al mirarlos: precios visibles, velocidad, cómo captan contacto\n\nSi no hay diferencial claro, el primer trabajo es de posicionamiento, no de diseño. Se dice.\n\n---\n\n## G · Activos digitales — crítico · tramos 2–4\n\n| Campo | Detalle |\n|---|---|\n| Dominio | Cuál es y **a nombre de quién está** |\n| Registrador y accesos | NIC.ar, GoDaddy, Donweb |\n| Hosting actual | Proveedor, plan, accesos |\n| Correos corporativos | Cuántos, en qué servicio |\n| Analytics / Search Console | Existe, hay histórico, acceso otorgado |\n| Google Business | Existe, completo, cuántas reseñas |\n| Redes activas | Cuáles y quién las maneja |\n| Píxeles y campañas previas | Meta, Google Ads |\n\nEl dominio a nombre del proveedor anterior es la sorpresa cara clásica. **Se detecta temprano\no se paga tarde.**\n\n---\n\n## H · Marca y contenido — tramo 4\n\n- Logo en vector, o el mejor archivo disponible\n- Manual de marca, colores, tipografías\n- Fotos propias: cantidad y calidad real\n- Video disponible\n- Catálogo, lista de precios, menú\n- Textos existentes\n- Certificaciones, premios, clientes nombrables\n\n**La falta de fotos es la causa número uno de demora.** Se diagnostica antes de prometer una fecha.\n\n---\n\n## I · Operación interna — sólo sistemas · tramo 3 + relevamiento\n\n- Proceso paso a paso, desde que entra un pedido hasta que se cobra\n- Qué se anota, dónde y quién lo anota\n- La excepción que rompe siempre el proceso\n- Volumen: operaciones por día en el pico\n- Integraciones necesarias: AFIP, Mercado Pago, ERP, banco, tienda\n- Quién lo va a usar y su comodidad con la tecnología\n- Qué pasa hoy cuando esa persona no está\n\nSin este bloque, **cualquier precio de sistema es inventado**. El relevamiento se cotiza como\netapa cerrada: si el cliente decide no seguir, se queda igual con el documento.\n\n---\n\n## J · Administrativo — tramo 5\n\n- Razón social, CUIT, domicilio fiscal, condición frente al IVA\n- Responsable de pagos con contacto directo\n- Forma y momento de pago\n- Mail de facturación\n- Alcance final y extras aprobados\n\nSe pide **recién cuando hay un sí**. Antes se lee como dar la venta por hecha.\n\n---\n\n## Dónde vive la ficha\n\nUn documento (o registro) por cliente, con los diez bloques y el estado de cada uno. Reglas:\n\n1. Se actualiza en el momento, no \"después\".\n2. Las frases del cliente van textuales, entre comillas.\n3. Los pendientes se marcan como pendientes, no se dejan vacíos.\n4. Antes de escribirle al cliente, se abre la ficha. Siempre.\n"}, {"file": "07-reglas-ux.md", "n": "07", "group": "Transversal", "title": "Reglas de interacción", "body": "# Reglas de interacción\n\nLos principios que gobiernan todos los tramos. Cuando una decisión operativa no esté escrita\nen el archivo del tramo, se resuelve con estas ocho reglas.\n\n---\n\n## 1. Cada pedido de datos paga con una devolución\n\nNunca se pide información \"para evaluar tu caso\". Se pide para devolver algo concreto:\n\n| Se pide | Se devuelve |\n|---|---|\n| 4 preguntas por WhatsApp | Que miremos su caso y su competencia antes de hablar |\n| Micro-formulario | El análisis de competidores arriba de la mesa en la reunión |\n| 45 minutos de charla | El diagnóstico escrito con precios, en menos de 24 h |\n| Accesos y materiales | El mockup navegable con su contenido real |\n| Datos de facturación | El presupuesto cerrado, sin números que aparecen después |\n\nSi un pedido nuevo no tiene su contraprestación, sobra o está en el tramo equivocado.\n\n---\n\n## 2. Una sola ficha viva\n\nTodo lo que el cliente contesta se guarda en un único documento. Volver a preguntar algo que\nya dijo es la señal más rápida de que no lo estamos escuchando, y es exactamente lo que hace\nla agencia con la que nos comparan.\n\nAntes de escribirle, se abre la ficha.\n\n---\n\n## 3. El canal que ya usa\n\n- **WhatsApp** para todo lo corto: preguntas, recordatorios, avances, link del mockup.\n- **Formulario** sólo para lo que se copia y pega: links, accesos, opciones cerradas.\n- **Videollamada** una sola vez en todo el recorrido, grabada con permiso.\n- **Mail** para lo que necesita quedar formal: diagnóstico, presupuesto, factura.\n\nNadie tiene que instalar nada, crear una cuenta ni entrar a un portal para trabajar con nosotros.\n\n---\n\n## 4. Máximo cinco campos por pedido\n\nEl micro-form es de 90 segundos. El checklist de accesos es largo, pero es una lista tildable\ndonde se avanza de a poco, no un formulario que hay que completar de una sentada.\n\nSi aparece la necesidad de un campo más, se pregunta: ¿esto lo necesito **ahora** o lo necesito\npara el entregable siguiente? Casi siempre es lo segundo, y entonces va al tramo siguiente.\n\n---\n\n## 5. Preguntas de negocio, no de tecnología\n\n\"¿Qué te preguntan siempre antes de comprar?\" en lugar de \"¿querés WordPress?\".\n\nNadie tiene que saber vocabulario técnico para contestarnos bien. Cuando el cliente usa una\npalabra técnica mal, no se lo corrige: se traduce a lo que quiso decir y se sigue.\n\n---\n\n## 6. Accesos con lista, casillas y ejemplos\n\nNada de \"mandame los accesos\", que garantiza tres días de ida y vuelta. Cada ítem dice **dónde\nencontrarlo** y qué hacer si no lo tiene. Y se aclara que lo que falte lo resolvemos nosotros:\nla mayoría de las demoras son de vergüenza, no de desorden.\n\n---\n\n## 7. Un solo recordatorio\n\nSi no contesta: **un** recordatorio a las 48 h, sobre lo que falta y nada más. Después queda\nen seguimiento a 90 días. No se persigue a nadie.\n\nPerseguir no acelera nada y le enseña al cliente que puede ignorarnos sin costo. La ausencia\nde insistencia también comunica: comunica que tenemos trabajo.\n\n---\n\n## 8. Se devuelve entendido, no repetido\n\nEl diagnóstico abre **reformulando su problema con sus palabras**, no listando lo que nos dijo.\nAhí se valida que los datos estén bien antes de construir sobre ellos, y es el momento donde\nel cliente decide si entendimos su negocio.\n\n---\n\n## Métricas del propio embudo\n\nSe miden para ajustar el proceso, no para reportarle a nadie:\n\n| Métrica | Qué diagnostica si baja |\n|---|---|\n| Contactos positivos que agendan charla | Las cuatro preguntas están mal formuladas o son muchas |\n| Charlas agendadas que completan el formulario | El formulario es largo o no se explicó qué gana |\n| Charlas que llegan a diagnóstico | Estamos aceptando charlas que había que filtrar antes |\n| Diagnósticos que llegan a mockup | El diagnóstico no está convenciendo, o el precio sorprende |\n| Mockups que se firman | El descubrimiento no captó bien lo que el cliente necesitaba |\n| Días desde contacto hasta firma | Dónde se traba el proceso, casi siempre en el tramo 4 |\n\nSi un tramo pierde más de la mitad de la gente, el problema está en ese tramo, no en el lead.\n"}, {"file": "08-plantillas-mensajes.md", "n": "08", "group": "Transversal", "title": "Plantillas de mensajes", "body": "# Plantillas de mensajes\n\nTextos listos para copiar. Se adaptan al caso, pero el largo y el tono no se negocian: cortos,\nen voseo, sin superlativos y con la devolución siempre explícita.\n\n---\n\n## Tramo 1 · Apenas dice que sí\n\n> Buenísimo. Para no hacerte perder tiempo, tres cosas cortas:\n>\n> 1. ¿Qué rubro y en qué ciudad estás?\n> 2. ¿Qué es lo que hoy te está frenando?\n> 3. ¿Ya tenés web o sistema andando?\n>\n> Con eso miro tu caso y a tus competidores antes de hablar. ¿Te queda cómodo un rato de 45 min esta semana?\n\n## Tramo 1 · Si sólo pregunta el precio\n\n> Los precios están todos publicados acá: neasistemas.com.ar/precios\n> Abajo de la lista hay un estimador donde armás tu combinación y ves el número al instante.\n>\n> Si querés que le ponga números a **tu** caso puntual, dame 45 min de charla y te mando el\n> diagnóstico por escrito, sin cargo.\n\n## Tramo 1 · Descarte por presupuesto\n\n> Te contesto derecho: por lo que me contás, el trabajo que necesitás arranca en unos $X, y si\n> tu techo es otro, no te quiero hacer perder dos reuniones para llegar a eso.\n>\n> Si querés, igual te digo por dónde empezaría con ese presupuesto, aunque no lo hagamos nosotros.\n\n## Tramo 1 · Descarte por plazo\n\n> Para esa fecha no llego con algo que valga la pena, y prefiero decírtelo ahora.\n> Un trabajo así nos lleva entre X y Y semanas desde que arranca el diseño.\n>\n> Si la fecha se puede correr, avisame y lo armamos bien. Si no, entiendo perfecto.\n\n---\n\n## Tramo 2 · Envío del formulario\n\n> Te paso el link del formulario, son 5 campos y 90 segundos: [link]\n>\n> Es para llegar a la charla con la tarea hecha: cuando nos juntemos ya vas a tener el análisis\n> de tus competidores arriba de la mesa.\n\n## Tramo 2 · Recordatorio a las 48 h (el único)\n\n> Te dejo de nuevo el link por si se te traspapeló: [link]\n> Si preferís, lo hacemos en vivo el [día] y listo, no te compliques.\n\n---\n\n## Tramo 3 · Cierre de la charla\n\n> Listo, con esto me alcanza. Antes de mañana a esta hora te mando el diagnóstico por escrito:\n> qué te está frenando, qué conviene resolver primero y cuánto sale cada cosa.\n>\n> Si después de leerlo decidís que no, no me debés nada y el documento te queda igual.\n\n## Tramo 3 · Envío del diagnóstico\n\n> Acá está el diagnóstico: [link]\n>\n> Arranca con cómo entendí tu situación, así me corregís si me fui de tema. Después va lo que\n> encontré mirando a [competidor] y a los otros dos, qué haría primero y qué después, y los\n> precios de cada cosa.\n>\n> Leelo tranquilo y me decís. Si algo no cierra, lo hablamos.\n\n---\n\n## Tramo 4 · Pedido de accesos\n\n> Para armar el diseño con tu contenido real necesito esta lista. Marcá lo que tengas y lo que\n> no aparezca lo resolvemos nosotros, no te trabes por eso:\n>\n> ☐ Dominio (y a nombre de quién está)\n> ☐ Accesos al hosting o panel actual\n> ☐ Logo en vector (.ai / .svg) o el archivo de mejor calidad que tengas\n> ☐ Fotos propias\n> ☐ Catálogo o lista de precios\n> ☐ Google Business, si lo tenés\n>\n> Con eso arranco el mockup. Lo vas a poder abrir en el celular antes de que exista un contrato.\n\n## Tramo 4 · Recordatorio de lo que falta\n\n> Vamos bien, ya tengo casi todo. Me quedan dos cosas:\n> ☐ [pendiente 1]\n> ☐ [pendiente 2]\n>\n> Con eso te mando el mockup el [día].\n\n## Tramo 4 · Aviso de demora\n\n> Te aviso para que no te sorprenda: sin [lo que falta] el diseño queda a mitad de camino, así\n> que la fecha de publicación se corre a [nueva fecha]. Apenas lo tengas, seguimos.\n\n---\n\n## Tramo 5 · Envío del mockup\n\n> Ahí está el diseño: [link]\n>\n> Abrilo en el celular y tocá todo, está navegable de verdad. Anotá lo que te chirríe, por\n> chiquito que sea: cambiarlo ahora es una tarde, cambiarlo con el sitio programado es plata.\n>\n> El [día] lo repasamos juntos.\n\n## Tramo 5 · Envío del presupuesto\n\n> Te paso el presupuesto con lo que definimos: [link]\n>\n> Está el producto base, cada extra con su precio al lado, el total y la forma de pago. Va\n> incluido el primer año de soporte completo, y el dominio, las cuentas y el código quedan a\n> nombre de tu empresa.\n>\n> Lo que no está en ese documento, no se factura después.\n\n---\n\n## Cierres sin venta\n\n### Frena después del diagnóstico\n\n> Todo bien, gracias por avisarme. El diagnóstico te queda: usalo para pedir otra cotización si\n> querés comparar, para eso lo escribimos así.\n>\n> Si en unos meses lo retomás, escribime y seguimos desde donde quedamos.\n\n### No contesta más\n\n*(Sin mensaje. Queda en seguimiento a 90 días. Se retoma con algo útil, no con \"¿seguís interesado?\".)*\n\n### Recontacto a los 90 días\n\n> Marcos, ¿cómo va? Estaba mirando el rubro y vi que [dato concreto y útil sobre su mercado o\n> su competencia]. Me acordé de lo que hablamos.\n>\n> Si lo querés retomar, tengo todo anotado y arrancamos sin repetir nada.\n"}]</script>
<script>
const DOCS = JSON.parse(document.getElementById('DATA').textContent);
const KEY = 'nea-plan-captura-v1';
const store = JSON.parse(localStorage.getItem(KEY) || '{}');
let cur = DOCS[0].file;

/* ── markdown mínimo: lo que usan estos documentos ── */
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,t,h)=>{
      const f = h.replace(/^\.\.\//,'').replace(/#.*$/,'');
      return DOCS.some(d=>d.file===f) ? `<a href="#${f}">${t}</a>` : `<a href="${h}" target="_blank" rel="noopener">${t}</a>`;
    });
}
function md(src){
  const L = src.split('\n'), out = [];
  let i = 0;
  const flush = t => out.push(t);
  while(i < L.length){
    const l = L[i];
    if(/^\s*$/.test(l)){ i++; continue; }
    if(/^#{1,4}\s/.test(l)){
      const n = l.match(/^#+/)[0].length;
      flush(`<h${n}>${inline(l.replace(/^#+\s/,''))}</h${n}>`); i++; continue;
    }
    if(/^---+\s*$/.test(l)){ flush('<hr>'); i++; continue; }
    if(/^\|/.test(l) && /^\|[\s:|-]+\|?\s*$/.test(L[i+1]||'')){
      const head = l.split('|').slice(1,-1).map(c=>`<th>${inline(c.trim())}</th>`).join('');
      i += 2; const rows = [];
      while(i < L.length && /^\|/.test(L[i])){
        rows.push('<tr>' + L[i].split('|').slice(1,-1).map(c=>`<td>${inline(c.trim())}</td>`).join('') + '</tr>');
        i++;
      }
      flush(`<table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table>`);
      continue;
    }
    if(/^>\s?/.test(l)){
      const b = [];
      while(i < L.length && /^>/.test(L[i])){ b.push(L[i].replace(/^>\s?/,'')); i++; }
      flush(`<blockquote>${md(b.join('\n'))}</blockquote>`); continue;
    }
    if(/^\s*[-*]\s\[\s?\]/.test(l)){
      const it = [];
      while(i < L.length && /^\s*[-*]\s\[\s?\]/.test(L[i])){ it.push(`<li>${inline(L[i].replace(/^\s*[-*]\s\[\s?\]\s?/,''))}</li>`); i++; }
      flush(`<ul class="task">${it.join('')}</ul>`); continue;
    }
    if(/^\s*[-*]\s/.test(l)){
      const it = [];
      while(i < L.length && /^\s*[-*]\s/.test(L[i])){ it.push(`<li>${inline(L[i].replace(/^\s*[-*]\s/,''))}</li>`); i++; }
      flush(`<ul>${it.join('')}</ul>`); continue;
    }
    if(/^\s*\d+\.\s/.test(l)){
      const it = [];
      while(i < L.length && /^\s*\d+\.\s/.test(L[i])){ it.push(`<li>${inline(L[i].replace(/^\s*\d+\.\s/,''))}</li>`); i++; }
      flush(`<ol>${it.join('')}</ol>`); continue;
    }
    const p = [];
    while(i < L.length && !/^\s*$/.test(L[i]) && !/^[#>|-]/.test(L[i]) && !/^\s*\d+\.\s/.test(L[i])){ p.push(L[i]); i++; }
    if(p.length) flush(`<p>${inline(p.join(' '))}</p>`);
  }
  return out.join('\n');
}

/* ── datos ── */
const doc = f => DOCS.find(d => d.file === f);
const body = f => (store[f] !== undefined ? store[f] : doc(f).body);
const dirty = f => store[f] !== undefined && store[f] !== doc(f).body;

/* ── árbol ── */
function buildTree(){
  const tree = document.getElementById('tree');
  const groups = {};
  DOCS.forEach(d => { (groups[d.group] = groups[d.group] || []).push(d); });
  tree.innerHTML = Object.entries(groups).map(([g, items]) => `
    <div class="sec" data-g="${g}">
      <div class="grp tog">${g}</div>
      <div class="sub">${items.map(d => `
        <button class="node" data-f="${d.file}"><span class="n">${d.n}</span><span>${d.title}</span></button>`).join('')}
      </div>
    </div>`).join('');
  tree.querySelectorAll('.tog').forEach(t =>
    t.addEventListener('click', () => t.parentElement.classList.toggle('collapsed')));
  tree.querySelectorAll('.node').forEach(b =>
    b.addEventListener('click', () => { location.hash = b.dataset.f; }));
}

/* ── render ── */
function show(f){
  if(!doc(f)) f = DOCS[0].file;
  cur = f;
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('on', n.dataset.f === f));
  document.getElementById('path').textContent = 'plan-captura / ' + f + (dirty(f) ? ' · editado localmente' : '');
  document.getElementById('dot').hidden = !dirty(f);
  document.getElementById('revert').hidden = !dirty(f);
  document.getElementById('doc').innerHTML = md(body(f));
  endEdit();
  document.querySelector('main').scrollTop = 0;
}

/* ── edición ── */
const ta = document.getElementById('ta'), art = document.getElementById('doc');
function startEdit(){
  ta.value = body(cur); ta.hidden = false; art.hidden = true;
  document.getElementById('edit').hidden = true;
  document.getElementById('save').hidden = false;
  document.getElementById('cancel').hidden = false;
  ta.focus();
}
function endEdit(){
  ta.hidden = true; art.hidden = false;
  document.getElementById('edit').hidden = false;
  document.getElementById('save').hidden = true;
  document.getElementById('cancel').hidden = true;
}
document.getElementById('edit').addEventListener('click', startEdit);
document.getElementById('cancel').addEventListener('click', endEdit);
/* Servido por HTTP (nea-leads) el guardado va al .md real. Abierto como archivo
   suelto no hay servidor, y cae a localStorage: se edita igual y se exporta. */
document.getElementById('save').addEventListener('click', async e => {
  const texto = ta.value, btn = e.target;
  btn.textContent = 'Guardando…';
  let enServidor = false;
  if(location.protocol.startsWith('http')){
    try{
      const r = await fetch('api/plan', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({file: cur, body: texto})});
      enServidor = r.ok;
    }catch(_){ enServidor = false; }
  }
  if(enServidor){
    doc(cur).body = texto;
    delete store[cur];
  }else{
    store[cur] = texto;
  }
  localStorage.setItem(KEY, JSON.stringify(store));
  btn.textContent = 'Guardar';
  show(cur);
});
document.getElementById('revert').addEventListener('click', () => {
  if(!confirm('Descartar los cambios locales de este archivo y volver al original?')) return;
  delete store[cur]; localStorage.setItem(KEY, JSON.stringify(store)); show(cur);
});
document.getElementById('copy').addEventListener('click', async e => {
  await navigator.clipboard.writeText(body(cur));
  e.target.textContent = 'Copiado'; setTimeout(() => e.target.textContent = 'Copiar .md', 1400);
});
document.getElementById('dl').addEventListener('click', () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([body(cur)], {type:'text/markdown'}));
  a.download = cur; a.click(); URL.revokeObjectURL(a.href);
});
document.addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 's' && !ta.hidden){ e.preventDefault(); document.getElementById('save').click(); }
  if(e.key === 'Escape' && !ta.hidden) endEdit();
});

addEventListener('hashchange', () => show(location.hash.slice(1)));
buildTree();
show(location.hash.slice(1) || DOCS[0].file);
</script>
</body>
</html>
