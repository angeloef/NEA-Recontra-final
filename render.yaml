# Sitio nuevo de NEA Sistemas (demos/nea-sistemas/sitio). Basado en neasistemasweb/render.yaml.
# El HTML ya viene armado en ./site (python build.py): Render no corre build.
services:
  - type: web
    name: nea-sistemas-landing
    runtime: static
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: true
    domains:
      - neasistemas.com.ar
      - www.neasistemas.com.ar
    # Sin rewrite catch-all: es multipagina. Sin regla `/*`, Render sirve
    # site/404.html con status 404 real. No agregar `/* -> /index.html`.
    routes:
      # 301 de seo.md. En site/ no hay ningun archivo en estas rutas, asi la
      # regla gana (en el sitio viejo el stub con 200 le ganaba).
      - type: redirect
        source: /diseno-web
        destination: /sitios-web/
      - type: redirect
        source: /diseno-web/
        destination: /sitios-web/
      - type: redirect
        source: /tienda-online
        destination: /sitios-web/
      - type: redirect
        source: /tienda-online/
        destination: /sitios-web/
      - type: redirect
        source: /seo
        destination: /sitios-web/
      - type: redirect
        source: /seo/
        destination: /sitios-web/
      - type: redirect
        source: /precios
        destination: /cotizar/
      - type: redirect
        source: /precios/
        destination: /cotizar/
      - type: redirect
        source: /estimador.html
        destination: /cotizar/
      - type: redirect
        source: /google-ads
        destination: /anuncios/
      - type: redirect
        source: /google-ads/
        destination: /anuncios/
      - type: redirect
        source: /marketing-digital
        destination: /anuncios/
      - type: redirect
        source: /marketing-digital/
        destination: /anuncios/
      - type: redirect
        source: /casos
        destination: /trabajos/
      - type: redirect
        source: /casos/
        destination: /trabajos/
      # Canonizan las URL sin barra final.
      - type: redirect
        source: /marca
        destination: /marca/
      - type: redirect
        source: /sitios-web
        destination: /sitios-web/
      - type: redirect
        source: /sistemas-a-medida
        destination: /sistemas-a-medida/
      - type: redirect
        source: /anuncios
        destination: /anuncios/
      - type: redirect
        source: /trabajos
        destination: /trabajos/
      - type: redirect
        source: /nosotros
        destination: /nosotros/
      - type: redirect
        source: /cotizar
        destination: /cotizar/
      - type: redirect
        source: /privacidad
        destination: /privacidad/
      - type: redirect
        source: /terminos
        destination: /terminos/
      - type: redirect
        source: /agenda
        destination: /agenda/
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      # La agenda es personal (link con ?t=): fuera de los buscadores.
      - path: /agenda/*
        name: X-Robots-Tag
        value: noindex, nofollow
      # Fuentes e imagenes con nombre fijo: cache de una semana.
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /img/*
        name: Cache-Control
        value: public, max-age=604800
