services:
  - type: web
    name: nea-sistemas-landing
    runtime: static
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: true
    domains:
      - neasistemas.com.ar
      - www.neasistemas.com.ar
    # ponytail: sin rewrite catch-all. Es un sitio multipagina, no una SPA.
    # Sin regla `/*`, Render sirve site/404.html con status 404 real.
    # Hubo una regla manual `/* -> /index.html` en el dashboard: devolvia la home
    # con 200 y canonical a `/` para cualquier URL inexistente, una fabrica de
    # soft-404 y duplicados. Borrada por API; no la vuelvas a agregar.
    # Los redirects de abajo canonizan las URLs sin barra final.
    routes:
      - type: redirect
        source: /diseno-web
        destination: /diseno-web/
      - type: redirect
        source: /tienda-online
        destination: /tienda-online/
      - type: redirect
        source: /sistemas-a-medida
        destination: /sistemas-a-medida/
      - type: redirect
        source: /marketing-digital
        destination: /marketing-digital/
      - type: redirect
        source: /google-ads
        destination: /google-ads/
      - type: redirect
        source: /seo
        destination: /seo/
      - type: redirect
        source: /precios
        destination: /precios/
      - type: redirect
        source: /nosotros
        destination: /nosotros/
      - type: redirect
        source: /privacidad
        destination: /privacidad/
      - type: redirect
        source: /terminos
        destination: /terminos/
      - type: redirect
        source: /agenda
        destination: /agenda/
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
      # /estimador.html es un fragmento que app.js inyecta en la home y en /precios/.
      # Servido solo, es HTML sin <head>: no puede llevar meta robots. Lo saca del
      # indice el header, que es el unico lugar donde el fragmento no manda.
      - path: /estimador.html
        name: X-Robots-Tag
        value: noindex
