services:
  - type: web
    name: nea-sistemas-landing
    runtime: static
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: true
    domains:
      - neasistemas.com.ar
      - www.neasistemas.com.ar
    # ponytail: sin rewrite catch-all. Es un sitio multipagina, no una SPA.
    # Render sirve site/404.html con status 404 cuando no encuentra el archivo.
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), interest-cohort=()
